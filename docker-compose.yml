# TechTuxAcademy — production-ish Docker Compose stack.
#
# Quick start:
#   cp .env.example .env            # fill in JWT_SECRET and other values
#   docker compose up -d --build
#   docker compose run --rm -e RUN_SEED=true app   # seed demo content once
#
# The app serves the built React SPA and the REST API from the same origin
# (http://localhost:4000 by default). Put a TLS-terminating reverse proxy in
# front of it in production and set PUBLIC_SITE_URL=https://techtuxacademy.online.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-techtuxacademy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techtuxacademy}']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techtuxacademy}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-techtuxacademy}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      API_URL: ${API_URL:-http://localhost:4000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-TechTuxAcademy <no-reply@techtuxacademy.online>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@techtuxacademy.online}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@techtuxacademy.online}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-Student@12345}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - uploads:/app/server/uploads
    ports:
      - '${PORT:-4000}:4000'

volumes:
  pgdata:
  uploads:
