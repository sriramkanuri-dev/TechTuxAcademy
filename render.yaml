# render.yaml — Render Blueprint
#
# Deploys the TechTuxAcademy **Express backend (`server/`)** as a Render Web
# Service, paired with a managed PostgreSQL database. The React+Vite frontend
# in `client/` stays on Cloudflare Pages (see README "Cloudflare Pages"
# section) and is NOT part of this deployment.
#
# Deploy (from Render dashboard → New → Blueprint):
#   1. Sign up at https://render.com, link your GitHub repo
#      `sriramkanuri-dev/TechTuxAcademy`.
#   2. Render detects `render.yaml` (Blueprint) and offers "Import Blueprint".
#   3. Choose a region, review, Create. Render provisions the Web Service and
#      the managed PostgreSQL DB on a private network, then syncs the
#      connection strings into the Web Service env vars at deploy time.
#
# Build:   npm ci && npm run build      → install deps + tsc → server/dist + prisma client
# Start:   npm run migrate && npm start → deploy schema, then node server/dist/index.js

services:
  - type: web
    name: techtux-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Database (wired from the managed Postgres resource below)
      - key: DATABASE_URL
        fromDatabase:
          name: techtuxdb
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: techtuxdb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_DOMAIN
        value: .techtuxacademy.online
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://techtuxacademy.online
      - key: CLIENT_URL
        value: https://techtuxacademy.online
      - key: API_URL
        value: https://api.techtuxacademy.online
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: MAIL_FROM
        value: TechTuxAcademy <no-reply@techtuxacademy.online>
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: ALLOW_PROD_SEED
        value: "false"

databases:
  - name: techtuxdb
    plan: starter
    region: oregon
