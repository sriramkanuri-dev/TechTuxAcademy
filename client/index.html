<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#08080d" />
    <title>TechTuxAcademy — Master Technology. Build Your Future.</title>
    <meta
      name="description"
      content="TechTuxAcademy is a modern technology learning platform for Linux, programming, AI, electronics, VLSI, DevOps and cybersecurity. Learn in English or Telugu."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechTuxAcademy" />
    <meta property="og:title" content="TechTuxAcademy — Master Technology. Build Your Future." />
    <meta
      property="og:description"
      content="Practical, project-driven courses in Linux, programming, AI, electronics and cloud. Learn. Build. Innovate."
    />
    <meta property="og:url" content="https://techtuxacademy.online" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@techtuxacademy" />
    <link rel="canonical" href="https://techtuxacademy.online" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('tta-theme');
          if (theme === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
          var lang = localStorage.getItem('tta-language');
          if (lang === 'te') document.documentElement.lang = 'te';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
